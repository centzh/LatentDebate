# Usage: uv run extract_vit_probabilities.py --config config/swin/food101/sushi_tacos_weighted.yaml

dataset:
  hub_id: ethz/Food101
  split: validation
  include_classes:
    - sushi
    - tacos

model:
  pretrained: Neruoy/swin-finetuned-food101-e3
  device_map: cpu

strength:
  positive_class: sushi
  negative_class: tacos
  weight_by_cls_attention: true

output:
  path: data/swin/food101/sushi_tacos_weighted.jsonl

runtime:
  log_level: INFO
  tqdm_desc: Calculating initial strengths
  log_every_image: false
