# Usage: uv run extract_vit_probabilities.py --config config/swin/food101/beef_carpaccio_beef_tartare.yaml

dataset:
  hub_id: ethz/Food101
  split: validation
  include_classes:
    - beef_carpaccio
    - beef_tartare

model:
  pretrained: Neruoy/swin-finetuned-food101-e3
  device_map: cpu

strength:
  positive_class: beef_carpaccio
  negative_class: beef_tartare
  weight_by_cls_attention: false

output:
  path: data/swin/food101/beef_carpaccio_beef_tartare.jsonl

runtime:
  log_level: INFO
  tqdm_desc: Calculating initial strengths
  log_every_image: false
