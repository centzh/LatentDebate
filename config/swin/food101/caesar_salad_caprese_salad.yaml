# Usage: uv run extract_vit_probabilities.py --config config/swin/food101/caesar_salad_caprese_salad.yaml

dataset:
  hub_id: ethz/Food101
  split: validation
  include_classes:
    - caesar_salad
    - caprese_salad

model:
  pretrained: Neruoy/swin-finetuned-food101-e3
  device_map: cpu

strength:
  positive_class: caesar_salad
  negative_class: caprese_salad
  weight_by_cls_attention: false

output:
  path: data/swin/food101/caesar_salad_caprese_salad.jsonl

runtime:
  log_level: INFO
  tqdm_desc: Calculating initial strengths
  log_every_image: false
