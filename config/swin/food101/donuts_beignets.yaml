# Usage: uv run extract_vit_probabilities.py --config config/swin/food101/donuts_beignets.yaml

dataset:
  hub_id: ethz/Food101
  split: validation
  include_classes:
    - donuts
    - beignets

model:
  pretrained: Neruoy/swin-finetuned-food101-e3
  device_map: cpu

strength:
  positive_class: donuts
  negative_class: beignets
  weight_by_cls_attention: false

output:
  path: data/swin/food101/donuts_beignets.jsonl

runtime:
  log_level: INFO
  tqdm_desc: Calculating initial strengths
  log_every_image: false
