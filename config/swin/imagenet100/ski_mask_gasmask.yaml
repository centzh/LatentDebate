# Usage: uv run extract_vit_probabilities.py --config config/imagenet100/ski_mask_gasmask.yaml

dataset:
  hub_id: clane9/imagenet-100
  split: validation
  include_classes:
    - ski mask
    - "gasmask, respirator, gas helmet"

model:
  pretrained: google/vit-base-patch16-224
  device_map: cpu

strength:
  positive_class: ski mask
  negative_class: "gasmask, respirator, gas helmet"
  weight_by_cls_attention: false

output:
  path: data/imagenet100/ski_mask_gasmask.jsonl

runtime:
  log_level: INFO
  tqdm_desc: Calculating initial strengths
  log_every_image: false