# Usage: uv run extract_vit_probabilities.py --config config/imagenet100/rock_crab_fiddler_crab.yaml

dataset:
  hub_id: clane9/imagenet-100
  split: validation
  include_classes:
    - "rock crab, Cancer irroratus"
    - fiddler crab

model:
  pretrained: google/vit-base-patch16-224
  device_map: cpu

strength:
  positive_class: "rock crab, Cancer irroratus"
  negative_class: fiddler crab
  weight_by_cls_attention: false

output:
  path: data/imagenet100/rock_crab_fiddler_crab.jsonl

runtime:
  log_level: INFO
  tqdm_desc: Calculating initial strengths
  log_every_image: false