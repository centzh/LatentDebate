# Usage: uv run extract_vit_probabilities.py --config config/swin/cifar10/cat_airplane.yaml

dataset:
  hub_id: uoft-cs/cifar10
  split: test
  include_classes:
    - cat
    - airplane

model:
  pretrained: clr4takeoff/swin-small-cifar10
  device_map: cpu

strength:
  positive_class: cat
  negative_class: airplane
  weight_by_cls_attention: false

output:
  path: data/swin/cifar10/cat_airplane.jsonl

runtime:
  log_level: INFO
  tqdm_desc: Calculating initial strengths
  log_every_image: false
