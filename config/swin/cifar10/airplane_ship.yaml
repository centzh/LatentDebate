# Usage: uv run extract_vit_probabilities.py --config config/cifar10/airplane_ship.yaml

dataset:
  hub_id: uoft-cs/cifar10
  split: test
  include_classes:
    - airplane
    - ship

model:
  pretrained: clr4takeoff/swin-small-cifar10
  device_map: cpu

strength:
  positive_class: airplane
  negative_class: ship
  weight_by_cls_attention: false

output:
  path: data/swin/cifar10/airplane_ship.jsonl

runtime:
  log_level: INFO
  tqdm_desc: Calculating initial strengths
  log_every_image: false
