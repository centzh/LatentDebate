# Usage: uv run extract_vit_probabilities.py --config config/vit/oxford_flowers/balloon_flower_tree_poppy.yaml
# Pair chosen with random.seed(42) from VGG Oxford 102 category names.

dataset:
  hub_id: Voxel51/OxfordFlowers102
  split: test
  include_classes:
    - balloon flower
    - tree poppy

model:
  pretrained: benvened/vit-base-oxford-flowers
  device_map: cpu

strength:
  positive_class: balloon flower
  negative_class: tree poppy
  weight_by_cls_attention: false

output:
  path: data/vit/oxford_flowers/balloon_flower_tree_poppy.jsonl

runtime:
  log_level: INFO
  tqdm_desc: Calculating initial strengths
  log_every_image: false