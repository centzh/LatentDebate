# Usage: uv run extract_vit_probabilities.py --config config/oxford_flowers/poinsettia_hippeastrum.yaml
# Pair chosen with random.seed(42) from VGG Oxford 102 category names.

dataset:
  hub_id: Voxel51/OxfordFlowers102
  split: test
  include_classes:
    - poinsettia
    - hippeastrum

model:
  pretrained: benvened/vit-base-oxford-flowers
  device_map: cpu

strength:
  positive_class: poinsettia
  negative_class: hippeastrum
  weight_by_cls_attention: false

output:
  path: data/oxford_flowers/poinsettia_hippeastrum.jsonl

runtime:
  log_level: INFO
  tqdm_desc: Calculating initial strengths
  log_every_image: false