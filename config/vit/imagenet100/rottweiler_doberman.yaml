# Usage: uv run extract_vit_probabilities.py --config config/imagenet100/rottweiler_doberman.yaml

dataset:
  hub_id: clane9/imagenet-100
  split: validation
  include_classes:
    - Rottweiler
    - "Doberman, Doberman pinscher"

model:
  pretrained: google/vit-base-patch16-224
  device_map: cpu

strength:
  positive_class: Rottweiler
  negative_class: "Doberman, Doberman pinscher"
  weight_by_cls_attention: false

output:
  path: data/imagenet100/rottweiler_doberman.jsonl

runtime:
  log_level: INFO
  tqdm_desc: Calculating initial strengths
  log_every_image: false