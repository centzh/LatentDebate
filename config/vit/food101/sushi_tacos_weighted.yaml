# Usage: uv run extract_vit_probabilities.py --config config/food101/sushi_tacos.yaml

dataset:
  hub_id: ethz/Food101
  split: validation
  include_classes:
    - sushi
    - tacos

model:
  pretrained: nateraw/vit-base-food101
  device_map: cpu

strength:
  positive_class: sushi
  negative_class: tacos
  weight_by_cls_attention: true

output:
  path: data/food101/sushi_tacos_weighted.jsonl

runtime:
  log_level: INFO
  tqdm_desc: Calculating initial strengths
  log_every_image: false
