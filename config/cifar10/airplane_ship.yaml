# Usage: uv run extract_vit_probabilities.py --config config/cifar10/airplane_ship.yaml

dataset:
  hub_id: uoft-cs/cifar10
  split: test
  include_classes:
    - airplane
    - ship

model:
  pretrained: nateraw/vit-base-patch16-224-cifar10
  device_map: cpu

strength:
  positive_class: airplane

output:
  path: data/cifar10/airplane_ship.jsonl

runtime:
  log_level: INFO
  tqdm_desc: Calculating initial strengths
  log_every_image: false
